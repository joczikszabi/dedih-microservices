# einvoice-mock: stands in for an external invoicing system.
# Its ServiceAccount is its identity in block 4: spiffe://cluster.local/ns/shop/sa/einvoice-mock
apiVersion: v1
kind: ServiceAccount
metadata:
  name: einvoice-mock
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: einvoice-mock
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: einvoice-mock
  template:
    metadata:
      labels:
        app: einvoice-mock
    spec:
      serviceAccountName: einvoice-mock
      containers:
        - name: einvoice-mock
          image: retro-shop/einvoice-mock:v1
          imagePullPolicy: Never  # loaded with `kind load`, there is no registry
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          lifecycle:
            preStop:  # keep serving for 5 s while the pod leaves the Service
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: einvoice-mock
  namespace: shop
spec:
  selector:
    app: einvoice-mock
  ports:
    - name: http  # tells Istio this is HTTP, needed for "RBAC: access denied"
      port: 8000
      targetPort: 8000
