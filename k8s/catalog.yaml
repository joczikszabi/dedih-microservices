# catalog: products, prices and stock.
# Its ServiceAccount is its identity in block 4: spiffe://cluster.local/ns/shop/sa/catalog
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      serviceAccountName: catalog
      containers:
        - name: catalog
          image: retro-shop/catalog:v1
          imagePullPolicy: Never  # loaded with `kind load`, there is no registry
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://catalog:catalogpw@postgres:5432/catalog
            # Block 3 changes this to roll out a new version.
            - name: APP_VERSION
              value: v1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          lifecycle:
            preStop:  # keep serving for 5 s while the pod leaves the Service
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: shop
spec:
  selector:
    app: catalog
  ports:
    - name: http  # tells Istio this is HTTP, needed for "RBAC: access denied"
      port: 8000
      targetPort: 8000
