# invoicing: invoices, sent on to the external system. Internal.
# Its ServiceAccount is its identity in block 4: spiffe://cluster.local/ns/shop/sa/invoicing
apiVersion: v1
kind: ServiceAccount
metadata:
  name: invoicing
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoicing
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoicing
  template:
    metadata:
      labels:
        app: invoicing
    spec:
      serviceAccountName: invoicing
      containers:
        - name: invoicing
          image: retro-shop/invoicing:v1
          imagePullPolicy: Never  # loaded with `kind load`, there is no registry
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://invoicing:invoicingpw@postgres:5432/invoicing
            - name: EINVOICE_URL
              value: http://einvoice-mock:8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          lifecycle:
            preStop:  # keep serving for 5 s while the pod leaves the Service
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: invoicing
  namespace: shop
spec:
  selector:
    app: invoicing
  ports:
    - name: http  # tells Istio this is HTTP, needed for "RBAC: access denied"
      port: 8000
      targetPort: 8000
