# orders: customers, login, checkout and refunds.
# Its ServiceAccount is its identity in block 4: spiffe://cluster.local/ns/shop/sa/orders
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      serviceAccountName: orders
      containers:
        - name: orders
          image: retro-shop/orders:v1
          imagePullPolicy: Never  # loaded with `kind load`, there is no registry
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://orders:orderspw@postgres:5432/orders
            - name: JWT_SECRET
              value: 97f64973698cc8b92938e2913a1cf833
            - name: CATALOG_URL
              value: http://catalog:8000
            - name: PAYMENTS_URL
              value: http://payments:8000
            - name: INVOICING_URL
              value: http://invoicing:8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          lifecycle:
            preStop:  # keep serving for 5 s while the pod leaves the Service
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: shop
spec:
  selector:
    app: orders
  ports:
    - name: http  # tells Istio this is HTTP, needed for "RBAC: access denied"
      port: 8000
      targetPort: 8000
