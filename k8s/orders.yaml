# orders: customers, login, checkout, refunds. Public through Nginx.
#
# Its own ServiceAccount: in block 4 this becomes the workload identity,
# spiffe://cluster.local/ns/shop/sa/orders
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      serviceAccountName: orders
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders
          image: retro-shop/orders:v1
          # Loaded with `kind load docker-image`, there is no registry.
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: ORDERS_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shop-secrets
                  key: JWT_SECRET
            # Service discovery: just the Service name. Kubernetes DNS does the rest.
            - name: CATALOG_URL
              value: http://catalog:8000
            - name: PAYMENTS_URL
              value: http://payments:8000
            - name: INVOICING_URL
              value: http://invoicing:8000
          # On shutdown, keep serving for 5 more seconds while Kubernetes
          # takes this pod out of the Service. Without it a rolling update
          # drops the odd request (we saw exactly one 502 in testing).
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # Startup waits for Postgres, which can take a while on a busy
          # machine. Until /health answers once, liveness does not count.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: shop
spec:
  selector:
    app: orders
  ports:
    # The name "http" tells Istio this is HTTP traffic, so it can apply HTTP
    # level rules and answer "RBAC: access denied" instead of cutting the line.
    - name: http
      port: 8000
      targetPort: 8000
