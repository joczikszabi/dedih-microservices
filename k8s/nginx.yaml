# nginx: the gateway, the only way in from outside. Its configuration is
# nginx/gateway.conf, loaded into the ConfigMap "nginx-gateway" by cluster-up.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: nginx
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: gateway.conf
          readinessProbe:
            tcpSocket:
              port: 8080
      volumes:
        - name: config
          configMap:
            name: nginx-gateway
---
# NodePort 30080 is mapped to port 8080 by kind/kind-config.yaml.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: shop
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http  # tells Istio this is HTTP traffic
      port: 8080
      targetPort: 8080
      nodePort: 30080
