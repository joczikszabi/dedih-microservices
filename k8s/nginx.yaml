# nginx: the gateway, the only way in from outside.
#
# Same nginx/gateway.conf as stage B in Compose, here as a ConfigMap
# ("nginx-gateway", created from the file by scripts/cluster-up.sh).
# Nginx finds the services by name (web, catalog, orders), exactly as in
# Compose: the Kubernetes Service names are the same.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: nginx
      containers:
        - name: nginx
          image: nginx:1.30-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: gateway.conf
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: nginx-gateway
---
# NodePort 30080 is mapped to port 8080 of the Codespace by kind/kind-config.yaml.
# Every request opens a new connection to the Service, so with three catalog
# pods you really see three different "served by" names.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: shop
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
