# One Postgres server with one database and one user per service (db/init.sql,
# loaded into the ConfigMap "db-init" by cluster-up.sh).
# A StatefulSet, so `kubectl rollout restart deployment` in block 4 leaves it
# alone: the data is in an emptyDir and a restart would lose it.
# It stays outside the mesh (no sidecar).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: shop
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shop
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: postgres
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: tcp-postgres
          env:
            - name: POSTGRES_PASSWORD
              value: postgrespw
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: db-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shop
spec:
  selector:
    app: postgres
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
