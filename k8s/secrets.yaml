# Connection strings and the token signing key.
#
# Lab values, committed so that the lab works with one command. In a real
# project this file would not be in git: the values would come from a vault
# (Azure Key Vault, HashiCorp Vault) or be created by the pipeline.
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  namespace: shop
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgrespw
  CATALOG_DATABASE_URL: postgresql+psycopg://catalog:catalogpw@postgres:5432/catalog
  ORDERS_DATABASE_URL: postgresql+psycopg://orders:orderspw@postgres:5432/orders
  PAYMENTS_DATABASE_URL: postgresql+psycopg://payments:paymentspw@postgres:5432/payments
  INVOICING_DATABASE_URL: postgresql+psycopg://invoicing:invoicingpw@postgres:5432/invoicing
  JWT_SECRET: lab-only-secret-change-me-0123456789abcdef
