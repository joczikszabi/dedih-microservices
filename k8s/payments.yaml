# payments: simulated charges and refunds. Internal.
# Its ServiceAccount is its identity in block 4: spiffe://cluster.local/ns/shop/sa/payments
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      serviceAccountName: payments
      containers:
        - name: payments
          image: retro-shop/payments:v1
          imagePullPolicy: Never  # loaded with `kind load`, there is no registry
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://payments:paymentspw@postgres:5432/payments
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          lifecycle:
            preStop:  # keep serving for 5 s while the pod leaves the Service
              exec:
                command: ["sleep", "5"]
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: shop
spec:
  selector:
    app: payments
  ports:
    - name: http  # tells Istio this is HTTP, needed for "RBAC: access denied"
      port: 8000
      targetPort: 8000
