# Stage B: Nginx as an API gateway.
#
# The only door into the shop. Used by compose.nginx.yaml (block 2) and, as a
# ConfigMap, on Kubernetes (blocks 3 to 5).
#
# Read it top to bottom, section by section:
#   1. Rate limit zone          how many checkouts per customer per minute
#   2. Routing                  what is reachable at all, internal services are not
#   3. Token check              auth_request asks orders whether the token is valid
#   4. Admin routes             only for tokens with role admin
#   5. Retired API versions     /api/orders/v1/ answers 404
#
# What a gateway can NOT fix: business logic. It does not know whose order
# number 3 is (BOLA), and it does not know what a console should cost.

# ---------------------------------------------------------------------------
# 1. Rate limit zone
# ---------------------------------------------------------------------------
# Counted per token, not per IP address: behind a NAT or a corporate proxy
# many real customers share one IP, and a bot can rotate IPs cheaply but needs
# a logged-in account to buy anything.
# Only POST (placing an order) counts. Listing your orders is a GET on the
# same URL and is not limited. An empty key means "not counted".
map $request_method $checkout_key {
    POST    $http_authorization;
    default "";
}
# 6 requests per minute is one every 10 seconds. A human clicks "Buy" once.
limit_req_zone $checkout_key zone=checkout:10m rate=6r/m;

# 429 Too Many Requests instead of Nginx's default 503.
limit_req_status 429;

server {
    listen 8080;

    # Pass the client address on. The Host header is deliberately left as
    # Nginx sets it (e.g. "catalog:8000"): the Istio sidecar in block 4
    # routes by that name, and with the browser's host name instead it would
    # not recognise the destination.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Short JSON bodies for the errors the gateway itself produces.
    error_page 401 = @unauthorized;
    error_page 403 = @forbidden;
    error_page 429 = @too_many;
    location @unauthorized { default_type application/json; return 401 '{"detail":"Gateway: missing or invalid token"}\n'; }
    location @forbidden    { default_type application/json; return 403 '{"detail":"Gateway: forbidden"}\n'; }
    location @too_many     { default_type application/json; return 429 '{"detail":"Gateway: too many requests, slow down"}\n'; }

    # -----------------------------------------------------------------------
    # 2. Routing
    # -----------------------------------------------------------------------
    # The web shop itself: static files, public.
    location / {
        proxy_pass http://web:8080;
    }

    # Catalog: public, but read only. Reserving stock is for orders, inside.
    location /api/catalog/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://catalog:8000;
    }

    # Login, registration and the API docs need no token.
    location /api/orders/auth/ {
        proxy_pass http://orders:8000;
    }
    location = /api/orders/docs {
        proxy_pass http://orders:8000;
    }
    location = /api/orders/openapi.json {
        proxy_pass http://orders:8000;
    }

    # payments, invoicing and einvoice-mock have no location here at all.
    # From outside they do not exist. Inside the network they still do,
    # which is what block 4 is about.

    # -----------------------------------------------------------------------
    # 3. Token check
    # -----------------------------------------------------------------------
    # Everything else under /api/orders/ needs a valid token. Before passing
    # the request on, Nginx makes a sub-request to /_auth. 2xx lets it
    # through, 401 or 403 is returned to the client.
    location /api/orders/ {
        auth_request /_auth;
        proxy_pass http://orders:8000;
    }

    # Checkout gets the rate limit on top of the token check.
    # burst=2 nodelay: a customer may click twice quickly, the third is refused.
    location = /api/orders/ {
        limit_req zone=checkout burst=2 nodelay;
        auth_request /_auth;
        proxy_pass http://orders:8000;
    }

    # The sub-requests. "internal" means a client can not call these directly.
    location = /_auth {
        internal;
        proxy_pass http://orders:8000/api/orders/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location = /_auth_admin {
        internal;
        proxy_pass http://orders:8000/api/orders/auth/verify-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # -----------------------------------------------------------------------
    # 4. Admin routes
    # -----------------------------------------------------------------------
    # The refund endpoint in orders does not check the role (weakness 3).
    # The gateway does: a customer token gets 403 here and never reaches it.
    location /api/orders/admin/ {
        auth_request /_auth_admin;
        proxy_pass http://orders:8000;
    }

    # -----------------------------------------------------------------------
    # 5. Retired API versions
    # -----------------------------------------------------------------------
    # The old v1 endpoint is still deployed in orders (weakness 5). Until
    # someone deletes it, the gateway pretends it does not exist.
    location /api/orders/v1/ {
        default_type application/json;
        return 404 '{"detail":"Not Found"}\n';
    }
}
