# Stage A: Nginx as a plain reverse proxy. Routing only, no protection.
#
# Browser -> :8080 -> Nginx -> web / catalog / orders
#
# Note what is NOT here: no token check, no rate limit, nothing blocked. And
# in compose.yaml every service also has its own port, so Nginx is only one
# of five doors.

server {
    listen 8080;

    # Pass the client address on. The Host header is deliberately left as
    # Nginx sets it (e.g. "catalog:8000"): the Istio sidecar in block 4
    # routes by that name, and with the browser's host name instead it would
    # not recognise the destination.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location / {
        proxy_pass http://web:8080;
    }

    location /api/catalog/ {
        proxy_pass http://catalog:8000;
    }

    location /api/orders/ {
        proxy_pass http://orders:8000;
    }
}
