# Block 1: the open version of the shop. Nginx on 8080 only routes, and every
# backend service is also reachable on its own port (8001 to 8004).

services:
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, catalog, orders]
    restart: on-failure

  web:
    build: ./web
    image: retro-shop/web:v1

  catalog:
    build: ./services/catalog
    image: retro-shop/catalog:v1
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://catalog:catalogpw@postgres:5432/catalog
    depends_on: [postgres]
    restart: on-failure

  orders:
    build: ./services/orders
    image: retro-shop/orders:v1
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://orders:orderspw@postgres:5432/orders
      JWT_SECRET: 97f64973698cc8b92938e2913a1cf833
      CATALOG_URL: http://catalog:8000
      PAYMENTS_URL: http://payments:8000
      INVOICING_URL: http://invoicing:8000
    depends_on: [postgres]
    restart: on-failure

  payments:
    build: ./services/payments
    image: retro-shop/payments:v1
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://payments:paymentspw@postgres:5432/payments
    depends_on: [postgres]
    restart: on-failure

  invoicing:
    build: ./services/invoicing
    image: retro-shop/invoicing:v1
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://invoicing:invoicingpw@postgres:5432/invoicing
      EINVOICE_URL: http://einvoice-mock:8000
    depends_on: [postgres]
    restart: on-failure

  einvoice-mock:
    build: ./services/einvoice-mock
    image: retro-shop/einvoice-mock:v1

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgrespw
    volumes:
      # One database and one user per service, see db/init.sql.
      - ./db:/docker-entrypoint-initdb.d:ro
